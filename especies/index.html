<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Explorar por especies · Cuaderno de aves</title>
<meta name="description" content="Todas las aves del cuaderno, agrupadas por grupos: colibríes, rapaces, garzas, tangaras y más.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,300;1,6..72,400;1,6..72,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../comun/estilos.css">
<style>
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0}
.ex-top{background:var(--night);color:var(--night-ink);padding:4px 16px 34px}
.ex-bar{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:0 auto}
.ex-bar a{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:#EEF3EC;background:rgba(238,243,236,.08);padding:7px 12px;border-radius:999px;text-decoration:none}
.ex-head{max-width:1200px;margin:26px auto 0}
.ex-head h1{font-family:var(--display);font-weight:600;font-size:clamp(36px,6vw,64px);line-height:1;margin:10px 0 0}
.ex-head h1 em{font-style:italic;font-weight:400;color:#FF7A5C}
.ex-head p.lede{max-width:60ch;color:var(--night-muted);font-size:16.5px;line-height:1.55;margin:14px 0 0}
.ex-tools{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.ex-tools .in{max-width:1200px;margin:0 auto;padding:12px 16px;display:grid;gap:10px}
.ex-search{display:flex;gap:10px;align-items:center}
.ex-search input{flex:1;min-width:0;font:500 15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px}
.ex-count{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.ex-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ex-row::-webkit-scrollbar{display:none}
.ex-row .chip{flex:none;font-size:12.5px;padding:6px 12px;text-decoration:none}@media (max-width:640px){.ex-tools .in{padding:8px 12px;gap:7px}.ex-search input{padding:8px 14px;font-size:14px}.ex-row .chip{font-size:12px;padding:5px 10px}.grp{scroll-margin-top:130px}}
.ex-row .chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ex-row .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);align-self:center;flex:none;margin-right:4px}
main.ex{max-width:1200px;margin:0 auto;padding:10px 16px 100px}
.grp{padding-top:30px;scroll-margin-top:150px}
.grp h2{font-family:var(--display);font-weight:600;font-size:clamp(24px,3vw,32px);line-height:1.1;margin:0}
.grp .tax{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.grp .tax i{font-style:italic}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:14px}
.tile{text-decoration:none;background:var(--surface);border:0;border-radius:8px;overflow:hidden;padding:0;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.tile .ph{aspect-ratio:4/3;background:var(--line);position:relative;overflow:hidden}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile .badge{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(6,14,10,.6);color:#EEF3EC;padding:3px 8px;border-radius:999px}
.tile .badge.mig{color:#FF8E73}.tile .badge.dom{color:#F2C14E}
.tile .tx{padding:9px 11px 11px;display:grid;gap:2px}
.tile b{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.15}
.tile i{font-family:var(--display);font-size:13.5px;color:var(--muted)}
.tile .pl{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tile .pl span{font-family:var(--mono);font-size:10px;color:var(--resident);background:rgba(44,122,123,.1);padding:2px 6px;border-radius:4px}
.empty{padding:40px 0;color:var(--muted)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding-top:22px}
.gcard{position:relative;display:block;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--line);color:#fff;text-decoration:none;transition:transform .25s,box-shadow .25s}
.gcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.gcard img{width:100%;height:100%;object-fit:cover;display:block}
.gcard::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,14,10,.85) 0%,rgba(6,14,10,.2) 45%,rgba(6,14,10,0) 65%)}
.gcard .gt{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;display:grid;gap:2px}
.gcard b{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1}
.gcard small{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#E8D9A8}
.backg{font-family:var(--mono);font-size:12px;color:var(--resident);text-decoration:none;font-weight:500}
@media (max-width:640px){.gcards{grid-template-columns:1fr 1fr;gap:10px}.gcard b{font-size:17px}}

/* Ficha */
.scrim2{position:fixed;inset:0;background:rgba(6,14,10,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.scrim2.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:51;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow-y:auto;overscroll-behavior:contain}
.sheet.open{transform:none}
.sheet .media{background:#000;position:relative}
.sheet .media img{width:100%;max-height:58vh;object-fit:contain;display:block}
.sheet .cap{font-family:var(--mono);font-size:11.5px;color:var(--night-muted);background:var(--night);padding:8px 16px;margin:0}
.sheet .thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--night)}
.sheet .thumbs button{flex:none;width:64px;height:48px;border:2px solid transparent;border-radius:5px;padding:0;overflow:hidden;cursor:pointer;background:none}
.sheet .thumbs button[aria-selected=true]{border-color:#F2C14E}
.sheet .thumbs img{width:100%;height:100%;object-fit:cover}
.sheet .close{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:2;background:rgba(6,14,10,.6);color:#fff;border:0;border-radius:999px;padding:8px 14px;font:600 13px var(--body);cursor:pointer}
.sheet .body{padding:18px 20px 60px}
.sheet h2{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.05;margin:4px 0 0}
.sheet .sci{font-family:var(--display);font-style:italic;font-size:18px;color:var(--muted);margin:2px 0 0}
.sheet .alt{font-size:13px;color:var(--muted);margin:2px 0 0}
.sheet .fam{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sheet h3{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 6px}
.sheet p{line-height:1.55;margin:0}
.where{display:grid;gap:10px}
.where div{background:var(--surface);border-radius:8px;padding:12px 14px;border-left:3px solid var(--resident)}
.where a{font-weight:700;color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.proto{max-width:1200px;margin:0 auto;font-size:12.5px;color:var(--night-muted);font-family:var(--mono)}
</style>
</head>
<body>
<a href="../" class="volver">← Todos los lugares</a>
<header class="ex-top">
  <div class="ex-head">
    <p class="eyebrow" style="color:#C9D6CC" id="eb">Cuaderno de aves · Colombia</p>
    <h1 id="h1">Explorar por <em>especies</em></h1>
    <p class="lede" id="lede"></p>
  </div>
</header>
<div class="ex-tools"><div class="in">
  <div class="ex-search"><input id="q" type="search" autocomplete="off"><span class="ex-count" id="count"></span></div>
  <div class="ex-row" id="places" role="group"></div>
</div></div>
<main class="ex" id="main"></main>
<script src="../comun/i18n.js"></script>
<script src="datos.js"></script>
<script>
const $=s=>document.querySelector(s);
const EN=window.LANG==="en";
const T=EN?{lede:n=>`The ${n} wild species in the notebook in one place, grouped the way biologists order them but with everyday names. Each one opens its full profile, with all its photos and the places where I've seen it.`,
  ph:"Search: hummingbird, Piranga, garza…",place:"Place",all:"All",n:n=>`${n} species`,sp:n=>n===1?"1 species":`${n} species`,
  order:"Order",fam:"Family",fams:"Families",back:"← All groups",none:"No species match your search.",noneHere:"No species from this group in the selected place.",
  mig:"Migratory",dom:"Domestic",feral:"Feral",h1:'Browse by <em>species</em>',eb:"Bird notebook · Colombia",title:"Browse by species · Bird notebook"}
 :{lede:n=>`Las ${n} especies silvestres del cuaderno en un solo lugar, agrupadas como las ordenan los biólogos pero con nombres de todos los días. Cada una abre su ficha completa, con todas sus fotos y los lugares donde la he visto.`,
  ph:"Buscar: colibrí, Piranga, heron…",place:"Lugar",all:"Todos",n:n=>`${n} especies`,sp:n=>n===1?"1 especie":`${n} especies`,
  order:"Orden",fam:"Familia",fams:"Familias",back:"← Todos los grupos",none:"No hay especies que coincidan con la búsqueda.",noneHere:"Ninguna especie de este grupo en el lugar elegido.",
  mig:"Migratoria",dom:"Doméstica",feral:"Asilvestrada",h1:'Explorar por <em>especies</em>',eb:"Cuaderno de aves · Colombia",title:"Explorar por especies · Cuaderno de aves"};
const SHORT=EN?{bogota:"Bogotá",cartagena:"Cartagena",pijino:"Pijiño",barichara:"Barichara",cafetera:"Coffee Reg.",boyaca:"Boyacá"}:{bogota:"Bogotá",cartagena:"Cartagena",pijino:"Pijiño",barichara:"Barichara",cafetera:"Z. Cafetera",boyaca:"Boyacá"};
const LNAME=EN?{cartagena:"Cartagena and surroundings",cafetera:"Coffee Region",pijino:"Ciénaga de Pijiño"}:{};
const gname=g=>EN?g.en:g.n, cname=s=>(EN&&s.en)||s.common;
document.title=T.title;$("#h1").innerHTML=T.h1;$("#eb").textContent=T.eb;$("#q").placeholder=T.ph;$("#q").setAttribute("aria-label",T.ph);
let PLACE="",Q="";
$("#lede").textContent=T.lede(ESPECIES.filter(s=>!s.dom).length);
const norm=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
$("#places").innerHTML=`<span class="lbl">${T.place}</span><button class="chip" data-p="" aria-pressed="true">${T.all}</button>`+LUGARES.map(([l,n])=>`<button class="chip" data-p="${l}" aria-pressed="false">${LNAME[l]||n}</button>`).join("");
$("#places").addEventListener("click",e=>{const c=e.target.closest("[data-p]");if(!c)return;PLACE=c.dataset.p;$("#places").querySelectorAll("[data-p]").forEach(x=>x.setAttribute("aria-pressed",x===c));render();});
$("#q").addEventListener("input",e=>{Q=norm(e.target.value.trim());render();});
let GI=null;
function readHash(){const m=location.hash.match(/^#g(\d+)$/);GI=m?+m[1]:null;}
/* La ficha completa vive en la página del lugar: se abre allí, en el lugar elegido o en el primero donde se vio */
const href=s=>{const w=(PLACE&&s.where.find(x=>x.l===PLACE))||s.where[0];return `../${w.l}/#ave=${w.id}`;};
const tile=s=>`<a class="tile" href="${href(s)}"><div class="ph"><img src="${s.photos[0].mini}" alt="" loading="lazy">${s.dom?`<span class="badge dom">${s.feral?T.feral:T.dom}</span>`:s.mig?`<span class="badge mig">${T.mig}</span>`:""}</div><div class="tx"><b>${cname(s)}</b><i>${s.sci}</i><div class="pl">${s.where.map(w=>`<span>${SHORT[w.l]}</span>`).join("")}</div></div></a>`;
const tax=(g,arr)=>{const f=[...new Set(arr.map(s=>s.family))];return `<p class="tax">${T.order} ${g.o} · ${f.length>1?T.fams:T.fam} <i>${f.join(", ")}</i></p>`;};
const cover=arr=>{const w=arr.filter(s=>!s.dom);const c=(w.length?w:arr).slice().sort((a,b)=>b.photos.length-a.photos.length)[0];return c.photos[0].img;};
function render(){
  const vis=ESPECIES.filter(s=>(!PLACE||s.where.some(w=>w.l===PLACE))&&(!Q||norm([s.common,s.alt,s.en,s.enAlt,s.sci,s.family,GRUPOS[s.g].n,GRUPOS[s.g].en].join(" ")).includes(Q)));
  $("#count").textContent=T.n(vis.filter(s=>!s.dom).length);
  let h="";
  if(Q){
    GRUPOS.forEach((g,i)=>{const arr=vis.filter(s=>s.g===i);if(!arr.length)return;
      h+=`<section class="grp"><h2>${gname(g)}</h2>${tax(g,arr)}<div class="tiles">${arr.map(tile).join("")}</div></section>`;});
    h=h||`<p class="empty">${T.none}</p>`;
  } else if(GI!==null && GRUPOS[GI]){
    const g=GRUPOS[GI], arr=vis.filter(s=>s.g===GI);
    h=`<section class="grp"><a class="backg" href="#">${T.back}</a><h2 style="margin-top:14px">${gname(g)}</h2>${arr.length?tax(g,arr):""}<div class="tiles">${arr.map(tile).join("")}</div>${arr.length?"":`<p class="empty">${T.noneHere}</p>`}</section>`;
  } else {
    h='<div class="gcards">'+GRUPOS.map((g,i)=>{const arr=vis.filter(s=>s.g===i);if(!arr.length)return "";const n=arr.filter(s=>!s.dom).length||arr.length;
      return `<a class="gcard" href="#g${i}"><img src="${(!PLACE&&PORTADAS[i])||cover(arr)}" alt="" loading="lazy"><span class="gt"><b>${gname(g)}</b><small>${T.sp(n)}</small></span></a>`;}).join("")+'</div>';
  }
  $("#main").innerHTML=h;
}
readHash();render();
addEventListener("hashchange",()=>{readHash();render();scrollTo({top:document.querySelector(".ex-tools").offsetTop,behavior:"auto"});});
</script>
<script src="../comun/lugares.js"></script>
</body>
</html>
